<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhiteVanOps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #fafaf9;
      color: #1c1917;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      border: 1px solid #d6d3d1;
      border-radius: 2px;
      overflow: hidden;
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 1rem;
    }
    .kicker {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #78716c;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    h1 {
      font-family: 'Arial Narrow', 'Segoe UI', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1.25rem;
      color: #1c1917;
      text-transform: uppercase;
    }
    .bar {
      width: 180px;
      height: 3px;
      background: #e7e5e4;
      overflow: hidden;
      position: relative;
    }
    .bar::after {
      content: '';
      position: absolute;
      left: -40%;
      width: 40%;
      height: 100%;
      background: #1d4ed8;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }
    .status {
      margin-top: 0.9rem;
      font-size: 0.72rem;
      color: #78716c;
    }
  </style>
</head>
