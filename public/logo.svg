<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#292524"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6d3d1"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="56" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="56" fill="none" stroke="#44403c" stroke-width="8"/>

  <!-- speed lines -->
  <rect x="52" y="208" width="72" height="20" rx="10" fill="#3b82f6"/>
  <rect x="76" y="248" width="48" height="20" rx="10" fill="#2563eb"/>

  <!-- van body -->
  <path fill="url(#body)" d="
    M148 328
    V204
    q0 -20 20 -20
    h158
    q22 0 34 18
    l40 60
    q12 18 12 40
    v26
    q0 20 -20 20
    h-224
    q-20 0 -20 -20
    Z"/>

  <!-- cab window -->
  <path fill="#1c1917" d="
    M330 208
    q10 0 16 9
    l30 46
    q4 7 -5 7
    h-49
    q-8 0 -8 -8
    v-46
    q0 -8 8 -8
    Z"/>

  <!-- side accent stripe -->
  <rect x="148" y="296" width="264" height="16" fill="#3b82f6"/>
  <path fill="#3b82f6" d="M148 296 h264 v16 h-264 z" opacity="0"/>

  <!-- wheels -->
  <g>
    <circle cx="212" cy="348" r="38" fill="#1c1917"/>
    <circle cx="212" cy="348" r="36" fill="#0c0a09" stroke="#57534e" stroke-width="6"/>
    <circle cx="212" cy="348" r="14" fill="#e7e5e4"/>
    <circle cx="356" cy="348" r="38" fill="#1c1917"/>
    <circle cx="356" cy="348" r="36" fill="#0c0a09" stroke="#57534e" stroke-width="6"/>
    <circle cx="356" cy="348" r="14" fill="#e7e5e4"/>
  </g>
</svg>
